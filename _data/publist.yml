- title: "PokeNet: Learning Kinematic Models of Articulated Objects from Human Observations"
  image: anmol.png
  description: "Articulation modeling enables robots to learn how an object’s joints move so they can manipulate it effectively. PokeNet is an end-to-end framework that learns articulation models from a single human demonstration without prior object knowledge. From point cloud sequences, it predicts joint parameters, infers manipulation order, and tracks joint states over time."
  authors: Anmol Gupta, Weiwei Gu, Omkar Patil, Jun Ki Lee, Nakul Gopalan
  link:
    url: https://arxiv.org/abs/2602.02741
    display: 2026 IEEE International Conference on Robotics and Automation (ICRA)
  highlight: 1

- title: Factorizing Diffusion Policies for Observation Modality Prioritization
  image: dist-rw.png
  description: "We propose Factorized Diffusion Policies (FDP), a novel policy formulation that enables observational modalities to have differing influence on the action diffusion process by design, resulting in more performant and robust policies with strong improvements in low-data regimes and under distribution shifts."
  authors: Omkar Patil, Prabin Rath, Kartikay Pangaonkar, Eric Rosen, Nakul Gopalan
  link:
    url: https://arxiv.org/abs/2509.16830
    display: 2026 IEEE International Conference on Robotics and Automation (ICRA)
  highlight: 1

- title: XMoP- Whole-Body Control Policy for Zero-shot Cross-Embodiment Neural Motion Planning
  image: prabin_xmop.png
  description: "We propose Cross-Embodiment Motion Policy (XMoP), a neural policy for learning to plan over a distribution of manipulators."
  authors: Prabin Kumar Rath, Nakul Gopalan
  link:
    url: https://arxiv.org/abs/2409.15585v1
    display: 2025 IEEE International Conference on Robotics and Automation (ICRA)
  highlight: 0

- title: Learning Temporally Composable Task Segmentations with Language
  image: div_segm.gif
  description: "We present an approach to identify sub-tasks within a demonstrated robot trajectory with the supervision provided by language instructions."
  authors:
    Divyanshu Raj, Omkar Patil, Weiwei Gu, Chitta Baral, Nakul Gopalan
  link:
    url: https://ieeexplore.ieee.org/abstract/document/10802712
    display: 2024 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)
  highlight: 0

- title: Hardware-Software Co-Design for Path Planning by Drones
  image: weiwei_aaai24.png
  description: "This work consists of two main components- designing a hardware-software co-design, MT+, for adapting the Mikami-Tabuchi algorithm for on-board path planning by drones in a 3D environment; and development of a specialized custom hardware accelerator CDU, as a part of MT+, for parallel collision detection."
  authors:
    Ayushi Dube, Omkar Patil, Gian Singh, Nakul Gopalan, Sarma Vrudhula
  link:
    url: https://ieeexplore.ieee.org/document/10802753
    display: 2024 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)
  highlight: 0

- title: Interactive Visual Task Learning for Robots
  image: weiwei_aaai24.png
  description: "We present a framework for robots to learn novel visual concepts and tasks via in-situ linguistic interactions with human users."
  authors:
    Weiwei Gu, Anant Sah, Nakul Gopalan
  link:
    url: https://arxiv.org/abs/2312.13219
    display: In Proceedings of The 38th Annual AAAI Conference on Artificial Intelligence
  highlight: 0

